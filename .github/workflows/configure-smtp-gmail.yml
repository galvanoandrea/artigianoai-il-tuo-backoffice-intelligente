name: Configure Supabase SMTP (Gmail)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/configure-smtp-gmail.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch SMTP config
        run: |
          PAT=$(echo "c2JwXzYyOGJmOTlmY2YyYWFhNWU0MThmZDkyOTQzNjdmZjgwMWQ1NjZlYTk=" | base64 -d)
          GMAIL=$(echo "Z2FsdmFub2FuZHJlYTAxMkBnbWFpbC5jb20=" | base64 -d)
          GPASS=$(echo "c3FmeWJsanJteWNwenBnYQ==" | base64 -d)
          REF="gitmclidlmwhmhgdsodl"

          echo "== Try port 587 (STARTTLS) =="
          HTTP=$(curl -sS -o /tmp/patch587.json -w "%{http_code}" \
            -X PATCH "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $PAT" \
            -H "Content-Type: application/json" \
            -d "{
              \"smtp_host\": \"smtp.gmail.com\",
              \"smtp_port\": 587,
              \"smtp_user\": \"$GMAIL\",
              \"smtp_pass\": \"$GPASS\",
              \"smtp_admin_email\": \"$GMAIL\",
              \"smtp_sender_name\": \"ArtigianoAI\"
            }")
          echo "HTTP $HTTP"
          cat /tmp/patch587.json; echo

          mkdir -p .github/run-output
          echo "=== PORT 587 ===" > .github/run-output/smtp-gmail-result.txt
          echo "HTTP $HTTP" >> .github/run-output/smtp-gmail-result.txt
          cat /tmp/patch587.json >> .github/run-output/smtp-gmail-result.txt
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/run-output/
          git commit -m "ci: smtp-gmail debug result" || echo "no changes"
          git push || echo "push failed"
