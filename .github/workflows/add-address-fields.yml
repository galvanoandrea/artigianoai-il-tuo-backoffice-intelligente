name: Add address fields to clients
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-address-fields.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        run: |
          set -e
          PAT=$(echo "c2JwXzYyOGJmOTlmY2YyYWFhNWU0MThmZDkyOTQzNjdmZjgwMWQ1NjZlYTk=" | base64 -d)
          REF="gitmclidlmwhmhgdsodl"
          API="https://api.supabase.com/v1/projects/${REF}/database/query"

          SQL="ALTER TABLE public.clients ADD COLUMN IF NOT EXISTS cap TEXT NOT NULL DEFAULT ''; ALTER TABLE public.clients ADD COLUMN IF NOT EXISTS citta TEXT NOT NULL DEFAULT ''; ALTER TABLE public.clients ADD COLUMN IF NOT EXISTS provincia TEXT NOT NULL DEFAULT '';"

          jq -n --arg q "$SQL" '{query: $q}' > /tmp/body.json
          curl -sS -o /tmp/result.json -w "HTTP %{http_code}\n" \
            -X POST "$API" \
            -H "Authorization: Bearer $PAT" \
            -H "Content-Type: application/json" \
            --data @/tmp/body.json
          cat /tmp/result.json; echo

          mkdir -p .github/run-output
          cat /tmp/result.json > .github/run-output/add-address-fields.txt
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/run-output/
          git commit -m "ci: add address fields result" || echo "no changes"
          git push || echo "push failed"
