name: Test Gmail SMTP
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-gmail-smtp.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Try SMTP login + send
        run: |
          GMAIL=$(echo "Z2FsdmFub2FuZHJlYTAxMkBnbWFpbC5jb20=" | base64 -d)
          GPASS=$(echo "c3FmeWJsanJteWNwenBnYQ==" | base64 -d)
          export GMAIL GPASS
          python3 <<'PY' > /tmp/result.txt 2>&1 || true
          import os, smtplib, traceback
          from email.message import EmailMessage
          user = os.environ["GMAIL"]
          pwd  = os.environ["GPASS"]
          msg = EmailMessage()
          msg["Subject"] = "Test ArtigianoAI SMTP"
          msg["From"]    = f"ArtigianoAI <{user}>"
          msg["To"]      = "andreagalva@hotmail.it"
          msg.set_content("Questo è un test diretto da GitHub Actions via Gmail SMTP. Se ricevi questa email, Gmail SMTP funziona.")
          for port, use_ssl in [(465, True), (587, False)]:
              try:
                  print(f"=== Trying port {port} ssl={use_ssl} ===")
                  if use_ssl:
                      s = smtplib.SMTP_SSL("smtp.gmail.com", port, timeout=20)
                  else:
                      s = smtplib.SMTP("smtp.gmail.com", port, timeout=20)
                      s.starttls()
                  s.set_debuglevel(1)
                  s.login(user, pwd)
                  s.send_message(msg)
                  s.quit()
                  print(f"SUCCESS port {port}")
                  break
              except Exception as e:
                  print(f"FAIL port {port}: {type(e).__name__}: {e}")
                  traceback.print_exc()
          PY
          cat /tmp/result.txt
          mkdir -p .github/run-output
          # Strip password from output before committing
          sed "s|$GPASS|***|g" /tmp/result.txt > .github/run-output/gmail-test.txt
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/run-output/
          git commit -m "ci: gmail smtp test result" || echo "no changes"
          git push || echo "push failed"
