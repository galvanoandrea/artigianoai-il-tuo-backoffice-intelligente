name: Setup Gmail SMTP (test + configure)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/setup-gmail-smtp.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test SMTP then patch Supabase
        run: |
          PAT=$(echo "c2JwXzYyOGJmOTlmY2YyYWFhNWU0MThmZDkyOTQzNjdmZjgwMWQ1NjZlYTk=" | base64 -d)
          GMAIL=$(echo "YW5kcmVhZ2FsdmE5QGdtYWlsLmNvbQ==" | base64 -d)
          GPASS=$(echo "Y2tyd3VocW1oa2duZW9idg==" | base64 -d)
          REF="gitmclidlmwhmhgdsodl"
          export GMAIL GPASS

          echo "=== Step 1: test SMTP login + send ==="
          python3 <<'PY' > /tmp/smtp.txt 2>&1
          import os, smtplib
          from email.message import EmailMessage
          user = os.environ["GMAIL"]; pwd = os.environ["GPASS"]
          try:
              s = smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=20)
              s.login(user, pwd)
              msg = EmailMessage()
              msg["Subject"] = "ArtigianoAI - test SMTP"
              msg["From"] = f"ArtigianoAI <{user}>"
              msg["To"] = "andreagalva@hotmail.it"
              msg.set_content("Test diretto. Se ricevi questo, Gmail SMTP funziona.")
              s.send_message(msg); s.quit()
              print("SMTP_OK")
          except Exception as e:
              print(f"SMTP_FAIL: {type(e).__name__}: {e}")
          PY
          GPASS_ESC=$(printf '%s' "$GPASS" | sed 's/[\/&]/\\&/g')
          SMTP_RES=$(sed "s|$GPASS_ESC|***|g" /tmp/smtp.txt)
          echo "$SMTP_RES"

          if ! grep -q "SMTP_OK" /tmp/smtp.txt; then
            mkdir -p .github/run-output
            { echo "=== SMTP TEST ==="; echo "$SMTP_RES"; echo "=== Supabase not patched ==="; } > .github/run-output/gmail-setup.txt
            exit 0
          fi

          echo "=== Step 2: patch Supabase ==="
          HTTP=$(curl -sS -o /tmp/patch.json -w "%{http_code}" \
            -X PATCH "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $PAT" \
            -H "Content-Type: application/json" \
            -d "{
              \"smtp_host\": \"smtp.gmail.com\",
              \"smtp_port\": \"465\",
              \"smtp_user\": \"$GMAIL\",
              \"smtp_pass\": \"$GPASS\",
              \"smtp_admin_email\": \"$GMAIL\",
              \"smtp_sender_name\": \"ArtigianoAI\"
            }")
          PATCH_RES=$(grep -oE '"smtp_host":"[^"]*"|"smtp_port":"[^"]*"|"smtp_admin_email":"[^"]*"|"smtp_sender_name":"[^"]*"|"message":"[^"]*"' /tmp/patch.json)
          echo "HTTP $HTTP"
          echo "$PATCH_RES"

          mkdir -p .github/run-output
          {
            echo "=== SMTP TEST ==="
            echo "$SMTP_RES"
            echo ""
            echo "=== SUPABASE PATCH HTTP $HTTP ==="
            echo "$PATCH_RES"
          } > .github/run-output/gmail-setup.txt
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/run-output/
          git commit -m "ci: gmail setup result v2" || echo "no changes"
          git push || echo "push failed"
