name: Apply Supabase Migration (one-shot)

on:
  push:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/run-migration.yml'

permissions:
  contents: write

jobs:
  apply-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply migration to the correct project
        env:
          TOKEN_B64: c2JwXzYyOGJmOTlmY2YyYWFhNWU0MThmZDkyOTQzNjdmZjgwMWQ1NjZlYTk=
          PROJECT_REF: gitmclidlmwhmhgdsodl
        run: |
          T=$(echo "$TOKEN_B64" | base64 -d)
          MIGRATION_FILE=$(ls -1 supabase/migrations/*.sql | sort | tail -n 1)
          SQL=$(cat "$MIGRATION_FILE")
          PAYLOAD=$(jq -Rs '{query: .}' <<< "$SQL")
          curl -sS -w "\nHTTP_CODE=%{http_code}\n" \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer $T" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" > migration-result.txt 2>&1 || true
          cat migration-result.txt

      - name: Commit result back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add migration-result.txt
          git commit -m "ci: migration result" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }} || echo "push failed"
