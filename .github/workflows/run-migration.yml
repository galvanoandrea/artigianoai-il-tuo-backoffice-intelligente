name: Apply Supabase Migration (one-shot)

on:
  push:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/run-migration.yml'

permissions:
  contents: write

jobs:
  apply-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe token scopes
        env:
          TOKEN_B64: c2JwXzYyOGJmOTlmY2YyYWFhNWU0MThmZDkyOTQzNjdmZjgwMWQ1NjZlYTk=
        run: |
          T=$(echo "$TOKEN_B64" | base64 -d)
          {
            echo "=== GET /v1/projects ==="
            curl -sS -w "\nHTTP=%{http_code}\n" -H "Authorization: Bearer $T" "https://api.supabase.com/v1/projects"
            echo ""
            echo "=== GET /v1/projects/bqwyevchiblvxmosvabl ==="
            curl -sS -w "\nHTTP=%{http_code}\n" -H "Authorization: Bearer $T" "https://api.supabase.com/v1/projects/bqwyevchiblvxmosvabl"
            echo ""
            echo "=== GET /v1/projects/bqwyevchiblvxmosvabl/api-keys ==="
            curl -sS -w "\nHTTP=%{http_code}\n" -H "Authorization: Bearer $T" "https://api.supabase.com/v1/projects/bqwyevchiblvxmosvabl/api-keys"
          } > migration-result.txt 2>&1
          cat migration-result.txt

      - name: Commit result back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add migration-result.txt
          git commit -m "ci: migration result" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }} || echo "push failed"
