name: Add Stripe fields to profiles
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-stripe-fields.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        run: |
          set -e
          PAT="${{ secrets.SUPABASE_PAT }}"
          REF="gitmclidlmwhmhgdsodl"
          API="https://api.supabase.com/v1/projects/${REF}/database/query"

          SQL_FILE="supabase/migrations/20260525100000_add_stripe_fields.sql"
          jq -n --rawfile q "$SQL_FILE" '{query: $q}' > /tmp/body.json
          curl -sS -o /tmp/result.json -w "HTTP %{http_code}\n" \
            -X POST "$API" \
            -H "Authorization: Bearer $PAT" \
            -H "Content-Type: application/json" \
            --data @/tmp/body.json
          cat /tmp/result.json; echo

          mkdir -p .github/run-output
          cat /tmp/result.json > .github/run-output/add-stripe-fields.txt
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/run-output/
          git commit -m "ci: add stripe fields migration result" || echo "no changes"
          git push || echo "push failed"
