name: Setup admin (migration + user + role)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/setup-admin.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration + create admin
        run: |
          PAT=$(echo "c2JwXzYyOGJmOTlmY2YyYWFhNWU0MThmZDkyOTQzNjdmZjgwMWQ1NjZlYTk=" | base64 -d)
          ADMIN_EMAIL="andreagalva@hotmail.it"
          ADMIN_PASS=$(echo "R2FsdmExOTg5IQ==" | base64 -d)
          REF="gitmclidlmwhmhgdsodl"
          SUPA_URL="https://gitmclidlmwhmhgdsodl.supabase.co"

          echo "=== Step 1: get service_role key ==="
          curl -sS -o /tmp/keys.json -w "keys HTTP %{http_code}\n" \
            "https://api.supabase.com/v1/projects/$REF/api-keys?reveal=true" \
            -H "Authorization: Bearer $PAT"
          SRK=$(python3 -c "import json; ks=json.load(open('/tmp/keys.json')); print(next((k['api_key'] for k in ks if k.get('name')=='service_role'), ''))")
          if [ -z "$SRK" ]; then echo "service_role missing"; head -c 500 /tmp/keys.json; exit 1; fi
          echo "service_role len: ${#SRK}"

          echo "=== Step 2: apply user_roles migration via Management API ==="
          SQL='CREATE TYPE IF NOT EXISTS public.app_role AS ENUM ('"'"'admin'"'"', '"'"'user'"'"');'
          # PostgreSQL non supporta CREATE TYPE IF NOT EXISTS, uso DO block
          python3 > /tmp/migration.sql <<'PYEOF'
          print("""
          DO $$ BEGIN
            CREATE TYPE public.app_role AS ENUM ('admin', 'user');
          EXCEPTION WHEN duplicate_object THEN NULL;
          END $$;

          CREATE TABLE IF NOT EXISTS public.user_roles (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            user_id UUID NOT NULL REFERENCES auth.users(id) ON DELETE CASCADE,
            role public.app_role NOT NULL,
            created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
            UNIQUE (user_id, role)
          );

          ALTER TABLE public.user_roles ENABLE ROW LEVEL SECURITY;

          CREATE OR REPLACE FUNCTION public.has_role(_user_id uuid, _role public.app_role)
          RETURNS boolean
          LANGUAGE sql STABLE SECURITY DEFINER
          SET search_path = public
          AS $func$
            SELECT EXISTS (
              SELECT 1 FROM public.user_roles
              WHERE user_id = _user_id AND role = _role
            )
          $func$;

          REVOKE EXECUTE ON FUNCTION public.has_role(uuid, public.app_role) FROM public;
          GRANT EXECUTE ON FUNCTION public.has_role(uuid, public.app_role) TO authenticated, service_role;

          DROP POLICY IF EXISTS "Users can view their own roles" ON public.user_roles;
          CREATE POLICY "Users can view their own roles"
            ON public.user_roles FOR SELECT
            USING (auth.uid() = user_id);

          DROP POLICY IF EXISTS "Admins can view all roles" ON public.user_roles;
          CREATE POLICY "Admins can view all roles"
            ON public.user_roles FOR SELECT
            USING (public.has_role(auth.uid(), 'admin'));

          DROP POLICY IF EXISTS "Admins can insert roles" ON public.user_roles;
          CREATE POLICY "Admins can insert roles"
            ON public.user_roles FOR INSERT
            WITH CHECK (public.has_role(auth.uid(), 'admin'));

          DROP POLICY IF EXISTS "Admins can delete roles" ON public.user_roles;
          CREATE POLICY "Admins can delete roles"
            ON public.user_roles FOR DELETE
            USING (public.has_role(auth.uid(), 'admin'));
          """)
          PYEOF
          MIG_SQL=$(cat /tmp/migration.sql)
          jq -n --arg q "$MIG_SQL" '{query: $q}' > /tmp/mig-body.json
          curl -sS -o /tmp/mig.json -w "migration HTTP %{http_code}\n" \
            -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $PAT" \
            -H "Content-Type: application/json" \
            --data @/tmp/mig-body.json
          head -c 600 /tmp/mig.json; echo

          echo "=== Step 3: create admin user via Auth Admin API ==="
          curl -sS -o /tmp/user.json -w "create user HTTP %{http_code}\n" \
            -X POST "$SUPA_URL/auth/v1/admin/users" \
            -H "apikey: $SRK" -H "Authorization: Bearer $SRK" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASS\",\"email_confirm\":true}"
          USER_ID=$(python3 -c "import json; d=json.load(open('/tmp/user.json')); print(d.get('id') or d.get('user',{}).get('id') or '')")
          echo "user_id: $USER_ID"
          if [ -z "$USER_ID" ]; then
            echo "User creation may have failed. Response:"; cat /tmp/user.json
            echo "Trying to find existing user by email..."
            curl -sS -o /tmp/list.json "$SUPA_URL/auth/v1/admin/users" \
              -H "apikey: $SRK" -H "Authorization: Bearer $SRK"
            USER_ID=$(python3 -c "
          import json
          d=json.load(open('/tmp/list.json'))
          for u in d.get('users',[]):
              if u.get('email')=='$ADMIN_EMAIL':
                  print(u['id']); break
          ")
            echo "found user_id: $USER_ID"
          fi
          if [ -z "$USER_ID" ]; then echo "FATAL: no user_id"; exit 1; fi

          echo "=== Step 4: insert admin role ==="
          ROLE_SQL="INSERT INTO public.user_roles (user_id, role) VALUES ('$USER_ID', 'admin') ON CONFLICT (user_id, role) DO NOTHING RETURNING *;"
          jq -n --arg q "$ROLE_SQL" '{query: $q}' > /tmp/role-body.json
          curl -sS -o /tmp/role.json -w "role HTTP %{http_code}\n" \
            -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $PAT" \
            -H "Content-Type: application/json" \
            --data @/tmp/role-body.json
          cat /tmp/role.json; echo

          echo "=== Step 5: verify ==="
          curl -sS -o /tmp/verify.json \
            -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $PAT" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"SELECT email, role FROM auth.users u JOIN public.user_roles r ON r.user_id=u.id WHERE u.email='$ADMIN_EMAIL';\"}"
          cat /tmp/verify.json; echo

          mkdir -p .github/run-output
          {
            echo "=== USER ID ==="
            echo "$USER_ID"
            echo ""
            echo "=== VERIFY ==="
            cat /tmp/verify.json
            echo ""
            echo "=== SERVICE_ROLE_KEY (per Vercel) ==="
            echo "$SRK"
          } > .github/run-output/admin-setup.txt
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/run-output/
          git commit -m "ci: admin setup result" || echo "no changes"
          git push || echo "push failed"
