name: Fix updated_at trigger grants
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-updated-at-trigger.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration via Management API
        run: |
          set -e
          PAT="${{ secrets.SUPABASE_PAT }}"
          REF="gitmclidlmwhmhgdsodl"
          API="https://api.supabase.com/v1/projects/${REF}/database/query"

          cat > /tmp/fix.sql <<'SQL'
          CREATE OR REPLACE FUNCTION public.update_updated_at_column()
          RETURNS TRIGGER
          LANGUAGE plpgsql
          SECURITY DEFINER
          SET search_path = public
          AS $func$
          BEGIN NEW.updated_at = now(); RETURN NEW; END;
          $func$;

          GRANT EXECUTE ON FUNCTION public.update_updated_at_column() TO authenticated, anon, service_role;
          SQL

          jq -n --rawfile q /tmp/fix.sql '{query: $q}' > /tmp/body.json
          curl -sS -o /tmp/result.json -w "HTTP %{http_code}\n" \
            -X POST "$API" \
            -H "Authorization: Bearer $PAT" \
            -H "Content-Type: application/json" \
            --data @/tmp/body.json
          cat /tmp/result.json; echo

          mkdir -p .github/run-output
          cat /tmp/result.json > .github/run-output/fix-trigger.txt
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/run-output/
          git commit -m "ci: fix updated_at trigger result" || echo "no changes"
          git push || echo "push failed"
