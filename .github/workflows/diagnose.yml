name: Diagnose Supabase project state

on:
  push:
    paths:
      - '.github/workflows/diagnose.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tables + reload schema cache on user project
        env:
          TOKEN_B64: c2JwXzYyOGJmOTlmY2YyYWFhNWU0MThmZDkyOTQzNjdmZjgwMWQ1NjZlYTk=
          PROJECT_REF: gitmclidlmwhmhgdsodl
        run: |
          T=$(echo "$TOKEN_B64" | base64 -d)
          {
            echo "=== Project URL & API keys ==="
            curl -sS -H "Authorization: Bearer $T" "https://api.supabase.com/v1/projects/${PROJECT_REF}/api-keys?reveal=false" -w "\nHTTP=%{http_code}\n"
            echo ""
            echo "=== Check tables exist ==="
            PAYLOAD=$(jq -Rs '{query: .}' <<< "SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename;")
            curl -sS -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
              -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
              --data "$PAYLOAD" -w "\nHTTP=%{http_code}\n"
            echo ""
            echo "=== Reload PostgREST schema cache ==="
            PAYLOAD=$(jq -Rs '{query: .}' <<< "NOTIFY pgrst, 'reload schema';")
            curl -sS -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
              -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
              --data "$PAYLOAD" -w "\nHTTP=%{http_code}\n"
          } > diagnose-result.txt 2>&1
          cat diagnose-result.txt

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagnose-result.txt
          git commit -m "ci: diagnose result" || true
          git push origin HEAD:${{ github.ref_name }} || true
