name: Fix Supabase auth URLs
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-auth-urls.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch site_url and uri_allow_list
        run: |
          PAT=$(echo "c2JwXzYyOGJmOTlmY2YyYWFhNWU0MThmZDkyOTQzNjdmZjgwMWQ1NjZlYTk=" | base64 -d)
          REF="gitmclidlmwhmhgdsodl"
          SITE="https://artigianoai-il-tuo-backoffice-intelligente.vercel.app"
          ALLOW="$SITE,$SITE/*,$SITE/reset-password,http://localhost:3000,http://localhost:3000/*"
          echo "== PATCH =="
          curl -sS -o /tmp/patch.json -w "HTTP %{http_code}\n" \
            -X PATCH "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $PAT" \
            -H "Content-Type: application/json" \
            -d "{\"site_url\":\"$SITE\",\"uri_allow_list\":\"$ALLOW\"}"
          head -c 800 /tmp/patch.json; echo
          echo "== GET =="
          curl -sS -o /tmp/get.json \
            "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $PAT"
          grep -oE '"site_url":"[^"]*"|"uri_allow_list":"[^"]*"|"mailer_autoconfirm":[^,}]*' /tmp/get.json
          mkdir -p .github/run-output
          cp /tmp/patch.json .github/run-output/fix-auth-urls-patch.json
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/run-output/
          git commit -m "ci: fix-auth-urls result" || echo "no changes"
          git push || echo "push failed"
